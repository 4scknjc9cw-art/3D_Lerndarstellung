<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D-Lerndarstellung</title>
    <style>
      /* Farbschema (Kurt): angenehmes, sehr dunkles Schwarz + Orange als Kontrast.
         Lichtwellen behalten ihre physikalische Farbe — die kommt aus farbe.ts, nicht von hier. */
      :root {
        --hintergrund: #131315;
        --flaeche: rgba(30, 30, 33, 0.92);
        --rand: rgba(255, 255, 255, 0.07);
        --text: #ebe9e6;
        --akzent: #ff8c2e;
        --akzent-text: #1a1206;
      }
      html, body { margin: 0; height: 100%; background: var(--hintergrund); overflow: hidden; }
      canvas { display: block; }
      body { font-family: system-ui, sans-serif; color: var(--text); }
      .zeitleiste {
        position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
        display: flex; gap: 6px; background: var(--flaeche); border: 1px solid var(--rand);
        padding: 6px; border-radius: 10px;
      }
      .zeitleiste button {
        font: inherit; color: inherit; background: transparent; border: 0;
        padding: 8px 14px; border-radius: 6px; cursor: pointer;
      }
      .zeitleiste button:hover { background: rgba(255, 255, 255, 0.07); }
      .zeitleiste button.aktiv { background: var(--akzent); color: var(--akzent-text); font-weight: 600; }
      .hinweis {
        position: fixed; top: 16px; left: 16px; max-width: 520px; font-size: 14px;
        line-height: 1.45; background: var(--flaeche); border: 1px solid var(--rand);
        border-left: 3px solid var(--akzent); padding: 10px 14px; border-radius: 10px;
      }
      .hinweis b { color: var(--akzent); }
      .seitenfeld {
        position: fixed; top: 16px; right: 16px; bottom: 16px; width: 390px;
        display: flex; flex-direction: column; overflow: hidden;
        background: var(--flaeche); border: 1px solid var(--rand);
        border-radius: 12px; box-sizing: border-box;
      }
      .seitenfeld .inhalt { flex: 1; overflow-y: auto; padding: 4px 20px 16px; }
      .seitenfeld button { font: inherit; color: inherit; cursor: pointer; border: 0; }
      .seitenfeld button:disabled { opacity: 0.35; cursor: default; }
      .modus { display: flex; gap: 4px; padding: 10px 12px 6px; }
      .modus button {
        flex: 1; background: transparent; padding: 7px 0; border-radius: 7px; font-size: 14px;
      }
      .modus button:hover:not(:disabled) { background: rgba(255, 255, 255, 0.06); }
      .modus button.aktiv { background: rgba(255, 140, 46, 0.16); color: var(--akzent); font-weight: 600; }
      .fortschritt { font-size: 12.5px; color: #a8a39b; margin-top: 10px; }
      .seitenfeld h1 { font-size: 20px; margin: 4px 0 4px; }
      .navigation {
        display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--rand);
      }
      .navigation[hidden] { display: none; }
      .navigation button { flex: 1; padding: 10px 0; border-radius: 8px; font-size: 15px; }
      .navigation .zweitrangig { background: rgba(255, 255, 255, 0.07); }
      .navigation .hauptknopf { background: var(--akzent); color: var(--akzent-text); font-weight: 600; }
      .regler[hidden], .seitenfeld h2[hidden] { display: none; }
      .seitenfeld h2 {
        font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em;
        color: var(--akzent); margin: 20px 0 10px;
      }
      .erklaerung p { font-size: 14.5px; line-height: 1.55; margin: 10px 0; }
      .erklaerung .formel { font-size: 15px; overflow-x: auto; }
      .erklaerung .warum {
        display: none; border-left: 3px solid var(--akzent); padding-left: 10px;
        color: #d9d4cc;
      }
      .erklaerung .warum.sichtbar { display: block; }
      .regler { display: block; margin-bottom: 14px; }
      .regler-kopf { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 4px; }
      .regler-wert { font-variant-numeric: tabular-nums; color: var(--akzent); }
      .regler input[type='range'] { width: 100%; accent-color: var(--akzent); }
      .zeitleiste { left: calc(50% - 205px); }
      .beschriftungen { position: fixed; top: 0; left: 0; pointer-events: none; }
      .beschriftung {
        font: 600 15px system-ui, sans-serif; color: var(--text);
        background: rgba(19, 19, 21, 0.75); padding: 1px 6px; border-radius: 5px;
      }
      .beschriftung.akzent { color: var(--akzent); }
      .ansicht-leiste { display: flex; gap: 4px; margin: 10px 0 4px; }
      .ansicht-leiste[hidden] { display: none; }
      .ansicht-leiste button {
        flex: 1; background: rgba(255, 255, 255, 0.06); padding: 7px 0; border-radius: 7px;
        font-size: 14px;
      }
      .ansicht-leiste button.aktiv { background: rgba(255, 140, 46, 0.16); color: var(--akzent); font-weight: 600; }
      .auswahl {
        margin: 14px 0 6px; padding: 10px 12px; border-radius: 10px;
        background: rgba(255, 140, 46, 0.07); border: 1px solid rgba(255, 140, 46, 0.35);
      }
      .auswahl[hidden] { display: none; }
      .auswahl-kopf {
        display: flex; justify-content: space-between; align-items: center;
        font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--akzent);
      }
      .auswahl-kopf button { background: transparent; font-size: 18px; line-height: 1; padding: 0 4px; }
      .fps {
        position: fixed; top: 16px; right: 424px; font: 14px monospace;
        background: rgba(0, 0, 0, 0.6); padding: 4px 8px; border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
